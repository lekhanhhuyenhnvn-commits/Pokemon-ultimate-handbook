<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokémon Ultimate Handbook</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: linear-gradient(135deg, #e53935, #ff7043);
    color: white;
    padding: 25px 15px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
    opacity: 0.9;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

.toolbar {
    background: white;
    padding: 18px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}

button,
.upload-label {
    border: none;
    background: #e53935;
    color: white;
    padding: 11px 16px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
}

button:hover,
.upload-label:hover {
    background: #c62828;
    transform: translateY(-1px);
}

input[type="file"] {
    display: none;
}

input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 15px;
}

.empty {
    background: white;
    padding: 50px 20px;
    text-align: center;
    border-radius: 15px;
    color: #777;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.pokemon-card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    margin-bottom: 25px;
}

.card-top {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 25px;
    padding: 25px;
}

.pokemon-image {
    width: 100%;
    max-height: 350px;
    object-fit: contain;
    border-radius: 14px;
    background: #f1f3f5;
}

.pokemon-name {
    font-size: 34px;
    margin: 0 0 5px;
}

.ipa {
    color: #666;
    font-size: 18px;
    margin-bottom: 20px;
}

.section {
    margin-top: 22px;
}

.section h3 {
    margin-bottom: 10px;
    color: #d32f2f;
    border-bottom: 2px solid #eee;
    padding-bottom: 7px;
}

.description {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.language-box {
    padding: 15px;
    border-radius: 10px;
    background: #f7f8fa;
    line-height: 1.6;
}

.language-title {
    font-weight: bold;
    margin-bottom: 7px;
}

.vocab {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.word {
    background: #fff3e0;
    border: 1px solid #ffcc80;
    padding: 10px 13px;
    border-radius: 9px;
}

.word strong {
    color: #e65100;
}

.moves {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.move {
    background: #e3f2fd;
    border: 1px solid #90caf9;
    padding: 10px 13px;
    border-radius: 9px;
}

.card-actions {
    padding: 0 25px 25px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.delete-btn {
    background: #757575;
}

.delete-btn:hover {
    background: #424242;
}

.listen-btn {
    background: #1976d2;
}

.listen-btn:hover {
    background: #1565c0;
}

.library {
    margin-top: 30px;
}

.library h2 {
    margin-bottom: 15px;
}

.library-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
}

.library-item {
    background: white;
    border-radius: 13px;
    padding: 12px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.library-item:hover {
    transform: translateY(-3px);
}

.library-item img {
    width: 100%;
    height: 140px;
    object-fit: contain;
    background: #f5f5f5;
    border-radius: 9px;
}

.library-item-name {
    font-weight: bold;
    text-align: center;
    margin-top: 8px;
}

@media (max-width: 750px) {
    .card-top {
        grid-template-columns: 1fr;
    }

    .description {
        grid-template-columns: 1fr;
    }

    .pokemon-name {
        font-size: 28px;
    }

    header h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <h1>⚡ Pokémon Ultimate Handbook</h1>
    <p>Your Pokémon English Learning Handbook</p>
</header>

<div class="container">

    <div class="toolbar">

        <label class="upload-label">
            📷 Nạp ảnh Pokémon
            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >
        </label>

        <input
            type="text"
            id="pokemonNameInput"
            placeholder="Tên Pokémon..."
        >

        <button onclick="addPokemon()">
            ➕ Thêm Pokémon
        </button>

    </div>

    <div id="pokemonContainer">

        <div class="empty">
            <h2>📚 Pokémon Ultimate Handbook</h2>
            <p>Hãy chọn ảnh Pokémon và nhập tên để bắt đầu.</p>
        </div>

    </div>

    <div class="library">

        <h2>📖 Pokémon Library</h2>

        <div
            id="libraryList"
            class="library-list"
        ></div>

    </div>

</div>

<script>

let selectedImage = null;

let pokemonList =
    JSON.parse(
        localStorage.getItem("pokemonUltimateHandbook")
    ) || [];


// =========================
// CHỌN ẢNH
// =========================

document
.getElementById("imageInput")
.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        selectedImage = e.target.result;

        alert("Đã chọn ảnh Pokémon!");

    };

    reader.readAsDataURL(file);

});


// =========================
// THÊM POKÉMON
// =========================

function addPokemon() {

    const name =
        document
        .getElementById("pokemonNameInput")
        .value
        .trim();

    if (!name) {

        alert("Anh hãy nhập tên Pokémon.");

        return;
    }

    if (!selectedImage) {

        alert("Anh hãy chọn ảnh Pokémon.");

        return;
    }


    const pokemon = {

        id: Date.now(),

        name: name,

        ipa: "",

        image: selectedImage,

        english:
            "This Pokémon's English description will be added here.",

        vietnamese:
            "Phần mô tả tiếng Việt của Pokémon sẽ được thêm ở đây.",

        vocabulary: [
            {
                word: "example",
                meaning: "ví dụ"
            },
            {
                word: "powerful",
                meaning: "mạnh mẽ"
            }
        ],

        moves: [
            "Thunderbolt (Đòn Sấm Sét)",
            "Quick Attack (Đòn Đánh Nhanh)"
        ]

    };


    pokemonList.push(pokemon);

    saveData();

    displayPokemon(pokemon);

    renderLibrary();


    document
    .getElementById("pokemonNameInput")
    .value = "";

    document
    .getElementById("imageInput")
    .value = "";

    selectedImage = null;

}


// =========================
// HIỂN THỊ POKÉMON
// =========================

function displayPokemon(pokemon) {

    const container =
        document.getElementById("pokemonContainer");


    container.innerHTML = `

        <div class="pokemon-card">

            <div class="card-top">

                <div>

                    <img
                        class="pokemon-image"
                        src="${pokemon.image}"
                        alt="${pokemon.name}"
                    >

                </div>


                <div>

                    <h2 class="pokemon-name">
                        ${pokemon.name}
                    </h2>

                    <div class="ipa">
                        IPA:
                        <strong>
                            ${pokemon.ipa || "Chưa có"}
                        </strong>
                    </div>


                    <div class="section">

                        <h3>📖 Description</h3>

                        <div class="description">

                            <div class="language-box">

                                <div class="language-title">
                                    🇬🇧 English
                                </div>

                                ${pokemon.english}

                            </div>


                            <div class="language-box">

                                <div class="language-title">
                                    🇻🇳 Tiếng Việt
                                </div>

                                ${pokemon.vietnamese}

                            </div>

                        </div>

                    </div>


                    <div class="section">

                        <h3>📚 Vocabulary</h3>

                        <div class="vocab">

                            ${
                                pokemon.vocabulary
                                .map(v => `
                                    <div class="word">

                                        <strong>
                                            ${v.word}
                                        </strong>

                                        —
                                        ${v.meaning}

                                    </div>
                                `)
                                .join("")
                            }

                        </div>

                    </div>


                    <div class="section">

                        <h3>⚔️ Moves</h3>

                        <div class="moves">

                            ${
                                pokemon.moves
                                .map(move => `
                                    <div class="move">
                                        ${move}
                                    </div>
                                `)
                                .join("")
                            }

                        </div>

                    </div>

                </div>

            </div>


            <div class="card-actions">

                <button
                    class="listen-btn"
                    onclick="speakPokemon(${pokemon.id})"
                >
                    🔊 Listen
                </button>

                <button
                    class="delete-btn"
                    onclick="deletePokemon(${pokemon.id})"
                >
                    🗑️ Xóa Pokémon
                </button>

            </div>

        </div>

    `;

}


// =========================
// ĐỌC TIẾNG ANH
// =========================

function speakPokemon(id) {

    const pokemon =
        pokemonList.find(
            p => p.id === id
        );

    if (!pokemon) return;


    const text =
        pokemon.english;


    if (!("speechSynthesis" in window)) {

        alert(
            "Trình duyệt của anh không hỗ trợ đọc tiếng Anh."
        );

        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    utterance.lang = "en-US";

    utterance.rate = 0.85;

    utterance.pitch = 1;


    speechSynthesis.speak(utterance);

}


// =========================
// XÓA POKÉMON
// =========================

function deletePokemon(id) {

    if (
        !confirm(
            "Anh có chắc muốn xóa Pokémon này?"
        )
    ) {
        return;
    }


    pokemonList =
        pokemonList.filter(
            p => p.id !== id
        );


    saveData();

    renderLibrary();


    if (pokemonList.length > 0) {

        displayPokemon(
            pokemonList[pokemonList.length - 1]
        );

    } else {

        document
        .getElementById("pokemonContainer")
        .innerHTML = `

            <div class="empty">

                <h2>📚 Pokémon Ultimate Handbook</h2>

                <p>
                    Hãy chọn ảnh Pokémon và nhập tên để bắt đầu.
                </p>

            </div>

        `;

    }

}


// =========================
// LƯU DỮ LIỆU
// =========================

function saveData() {

    localStorage.setItem(

        "pokemonUltimateHandbook",

        JSON.stringify(pokemonList)

    );

}


// =========================
// THƯ VIỆN
// =========================

function renderLibrary() {

    const library =
        document.getElementById("libraryList");


    if (pokemonList.length === 0) {

        library.innerHTML =
            "<p>Chưa có Pokémon nào.</p>";

        return;
    }


    library.innerHTML =

        pokemonList
        .map(pokemon => `

            <div
                class="library-item"
                onclick="displayPokemonById(${pokemon.id})"
            >

                <img
                    src="${pokemon.image}"
                    alt="${pokemon.name}"
                >

                <div class="library-item-name">
                    ${pokemon.name}
                </div>

            </div>

        `)
        .join("");

}


// =========================
// MỞ POKÉMON TỪ THƯ VIỆN
// =========================

function displayPokemonById(id) {

    const pokemon =
        pokemonList.find(
            p => p.id === id
        );

    if (!pokemon) return;

    displayPokemon(pokemon);

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// =========================
// KHỞI ĐỘNG APP
// =========================

renderLibrary();


if (pokemonList.length > 0) {

    displayPokemon(
        pokemonList[pokemonList.length - 1]
    );

}

</script>

</body>
</html>
